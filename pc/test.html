<!doctype html>
<html lang="el">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  body { font-family: system-ui, sans-serif; margin: 0; padding: 16px; background: #f5f7fa; color: #1f2937; }
  h2 { margin: 0 0 4px; }
  .sub { color: #6b7280; margin-bottom: 16px; }
  table { border-collapse: collapse; width: 100%; background: #fff; border-radius: 8px; overflow: hidden; }
  th, td { padding: 10px; text-align: left; border-bottom: 1px solid #e5e7eb; }
  th { background: #2d6cdf; color: #fff; }
  .ok { color: #15803d; font-weight: 600; }
  .bad { color: #b91c1c; font-weight: 600; }
</style>
</head>
<body>
  <h2>Δοκιμαστική αναφορά</h2>
  <div class="sub">Αν τη βλέπεις μορφοποιημένη, όλα δουλεύουν.</div>
  <table>
    <tr><th>Event</th><th>Κατάσταση</th></tr>
    <tr><td>Backup</td><td class="ok">OK</td></tr>
    <tr><td>Δίσκος C:</td><td class="bad">92%</td></tr>
    <tr><td>Υπηρεσίες</td><td class="ok">12/12</td></tr>
  </table>
</body>
</html>
