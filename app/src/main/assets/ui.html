<!doctype html>
<html lang="el">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Αναφορές</title>
<style>
  :root {
    --bg: #F4F6FB; --card: #FFFFFF; --fg: #141824; --muted: #6B7280; --line: #E6E9F0;
    --brand: #2D6CDF; --brand-soft: #E6EEFC; --danger: #C93838;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0F1115; --card: #1A1D24; --fg: #ECEEF3; --muted: #9AA1AD; --line: #272B34;
      --brand: #5B8DEF; --brand-soft: #1E2A44; --danger: #F07070;
    }
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body { margin: 0; font: 16px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background: var(--bg); color: var(--fg); }
  header { position: sticky; top: 0; z-index: 2; background: var(--bg); display: flex; align-items: center; padding: 18px 12px 10px 20px; }
  h1 { flex: 1; margin: 0; font-size: 28px; font-weight: 700; letter-spacing: -.01em; }
  .badge { display: inline-block; vertical-align: middle; margin-left: 8px; padding: 2px 10px; border-radius: 999px;
           background: var(--brand); color: #fff; font-size: 13px; font-weight: 600; }
  .icon-btn { border: 0; background: none; color: var(--fg); width: 44px; height: 44px; border-radius: 50%;
              display: grid; place-items: center; }
  .icon-btn:active { background: var(--line); }
  .day { margin: 18px 20px 8px; font-size: 12px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
  .card { display: flex; gap: 12px; margin: 0 12px 8px; padding: 14px 12px 14px 14px; background: var(--card);
          border: 1px solid var(--line); border-radius: 16px; transition: transform .08s; }
  .card:active { transform: scale(.985); }
  .card:not(.read) { border-color: var(--brand); box-shadow: 0 1px 0 var(--brand); }
  .avatar { flex: none; width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center;
            background: var(--brand-soft); color: var(--brand); font-weight: 700; font-size: 17px; }
  .body { flex: 1; min-width: 0; }
  .top { display: flex; gap: 8px; align-items: baseline; }
  .title { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-weight: 500; }
  .card:not(.read) .title { font-weight: 700; }
  .time { flex: none; font-size: 13px; color: var(--muted); }
  .card:not(.read) .time { color: var(--brand); font-weight: 600; }
  .preview { margin-top: 3px; font-size: 14px; color: var(--muted);
             display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .del { flex: none; align-self: center; border: 0; background: none; color: var(--muted); width: 36px; height: 36px; border-radius: 50%; }
  .del:active { background: var(--line); color: var(--danger); }
  .center { text-align: center; padding: 56px 28px; color: var(--muted); }
  .center h2 { margin: 16px 0 8px; color: var(--fg); font-size: 21px; }
  .hero { width: 88px; height: 88px; margin: 0 auto; border-radius: 28px; display: grid; place-items: center;
          background: var(--brand-soft); color: var(--brand); }
  code { display: inline-block; margin-top: 6px; padding: 4px 8px; border-radius: 8px; background: var(--card);
         border: 1px solid var(--line); color: var(--fg); font-size: 13px; }
  .primary { display: inline-flex; align-items: center; justify-content: center; gap: 10px; width: 100%; max-width: 320px;
             margin: 24px 0 4px; padding: 15px; border: 0; border-radius: 14px; background: var(--brand); color: #fff;
             font-size: 16px; font-weight: 600; }
  .primary:active { filter: brightness(.92); }
  details { margin-top: 18px; }
  summary { color: var(--brand); font-weight: 500; cursor: pointer; }
  textarea { width: 100%; max-width: 320px; margin-top: 12px; padding: 12px; border-radius: 12px; border: 1px solid var(--line);
             background: var(--card); color: var(--fg); font: 13px/1.4 ui-monospace, monospace; resize: none; }
  .secondary { margin-top: 10px; padding: 11px 22px; border-radius: 12px; border: 1px solid var(--line); background: var(--card);
               color: var(--fg); font-size: 15px; font-weight: 500; }
  .err { color: var(--danger); font-size: 14px; min-height: 1.4em; }
  footer { padding: 28px 0 36px; text-align: center; font-size: 12px; color: var(--muted); }
</style>
</head>
<body>
<header>
  <h1>Αναφορές<span id="badge" class="badge" hidden></span></h1>
  <button id="repair" class="icon-btn" aria-label="Νέο pairing" title="Νέο pairing" hidden>
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/>
      <path d="M14 14h3v3M21 14v.01M14 21h3M21 17v4h-.01"/>
    </svg>
  </button>
</header>
<main id="main"></main>
<footer id="ver"></footer>

<template id="setup">
  <div class="center">
    <div class="hero">
      <svg width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M10 13a5 5 0 0 0 7.5.5l3-3a5 5 0 0 0-7-7l-1.7 1.7"/><path d="M14 11a5 5 0 0 0-7.5-.5l-3 3a5 5 0 0 0 7 7l1.7-1.7"/>
      </svg>
    </div>
    <h2>Σύνδεση με τον υπολογιστή</h2>
    <div>Στον υπολογιστή τρέξε<br><code>uv run send_report.py --qr</code><br>(την πρώτη φορά <code>--genkey</code>)<br>και σάρωσε τον κωδικό QR.</div>
    <button class="primary" id="scan">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 7V5a2 2 0 0 1 2-2h2M17 3h2a2 2 0 0 1 2 2v2M21 17v2a2 2 0 0 1-2 2h-2M7 21H5a2 2 0 0 1-2-2v-2M7 12h10"/></svg>
      Σάρωση QR
    </button>
    <details>
      <summary>ή επικόλλησε τον κωδικό</summary>
      <textarea id="code" rows="3" placeholder="https://ntfy.sh/…#…" autocapitalize="off" spellcheck="false"></textarea><br>
      <button class="secondary" id="save">Αποθήκευση</button>
      <div class="err" id="err"></div>
    </details>
  </div>
</template>

<template id="empty">
  <div class="center">
    <div class="hero">
      <svg width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/>
      </svg>
    </div>
    <h2>Καμία αναφορά ακόμα</h2>
    <div>Συνδεδεμένο. Δοκίμασε από τον υπολογιστή:<br><code>uv run send_report.py test.html "Δοκιμή"</code></div>
  </div>
</template>

<script>
  const $ = (s) => document.querySelector(s);
  const main = $('#main');
  const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const midnight = (d) => { const x = new Date(d); x.setHours(0, 0, 0, 0); return x.getTime(); };

  function dayLabel(d) {
    const days = Math.round((midnight(Date.now()) - midnight(d)) / 864e5);
    if (days === 0) return 'Σήμερα';
    if (days === 1) return 'Χθες';
    return d.toLocaleDateString('el-GR', { weekday: 'long', day: 'numeric', month: 'long' });
  }

  function render() {
    const s = JSON.parse(App.state());
    $('#ver').textContent = 'Report Notify v' + s.version;
    $('#repair').hidden = !s.paired;
    const unread = s.reports.filter((r) => !r.read).length;
    $('#badge').hidden = !unread;
    $('#badge').textContent = unread;

    if (!s.paired) {
      main.replaceChildren($('#setup').content.cloneNode(true));
      $('#scan').onclick = () => App.scan();
      $('#save').onclick = () => { $('#err').textContent = App.pair($('#code').value); };
      return;
    }
    if (!s.reports.length) {
      main.replaceChildren($('#empty').content.cloneNode(true));
      return;
    }
    let html = '', lastDay = '';
    for (const r of s.reports) {
      const d = new Date(r.time * 1000);
      const day = dayLabel(d);
      if (day !== lastDay) { html += `<div class="day">${esc(day)}</div>`; lastDay = day; }
      html += `
        <div class="card${r.read ? ' read' : ''}" data-name="${esc(r.name)}">
          <div class="avatar">${esc((r.title.trim()[0] || '#').toUpperCase())}</div>
          <div class="body">
            <div class="top">
              <span class="title">${esc(r.title)}</span>
              <span class="time">${d.toLocaleTimeString('el-GR', { hour: '2-digit', minute: '2-digit' })}</span>
            </div>
            <div class="preview">${esc(r.preview || '—')}</div>
          </div>
          <button class="del" aria-label="Διαγραφή">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18M8 6V4h8v2M19 6l-1 14H6L5 6"/></svg>
          </button>
        </div>`;
    }
    main.innerHTML = html;
  }

  main.addEventListener('click', (e) => {
    const card = e.target.closest('.card');
    if (!card) return;
    if (e.target.closest('.del')) {
      if (confirm('Διαγραφή αυτής της αναφοράς;')) { App.remove(card.dataset.name); render(); }
    } else {
      App.open(card.dataset.name);
    }
  });

  $('#repair').onclick = () => {
    if (confirm('Νέο pairing;\n\nΗ σύνδεση με τον τωρινό υπολογιστή θα διακοπεί. Οι αναφορές που έχεις παραμένουν.')) {
      App.unpair();
      render();
    }
  };

  render();
</script>
</body>
</html>
