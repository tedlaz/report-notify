name: build-apk
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write # create GitHub Releases on tags

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      IS_TAG: ${{ startsWith(github.ref, 'refs/tags/v') }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      - name: Decode keystore
        run: echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.keystore"
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
      - name: Test + build
        run: gradle test assembleRelease
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/release.keystore
          KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASS }}
          VERSION_NAME: ${{ env.IS_TAG == 'true' && github.ref_name || '' }}
      - name: Name APK
        run: |
          V=$([ "$IS_TAG" = true ] && echo "$GITHUB_REF_NAME" || echo "dev-$GITHUB_RUN_NUMBER")
          cp app/build/outputs/apk/release/app-release.apk "report-notify-$V.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: report-notify-apk
          path: report-notify-*.apk
      - name: GitHub Release
        if: env.IS_TAG == 'true'
        run: gh release create "$GITHUB_REF_NAME" report-notify-*.apk --title "Report Notify $GITHUB_REF_NAME" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
